[tools]
node = "24"
gitleaks = "8"

[tasks.setup]
description = "Install the secret-scanning hook and dependencies"
run = [
  "git config core.hooksPath .githooks",
  "npm ci",
]

[tasks.dev]
description = "CRA dev server (reads .env)"
run = "npm start"

[tasks.build]
description = "Production build"
run = "npm run build"

[tasks.test]
description = "Jest, once (no tests yet)"
run = "CI=true npm test -- --passWithNoTests"

[tasks.lint]
description = "ESLint (react-app config)"
run = "npx eslint --ext .js,.jsx src"
